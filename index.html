let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// 1-4 boxes of snacks, galletas, abarrotes, bebidas · E/H/D freezers of boxes (empanadas,

const MAP = [
  '####################',
  '#1234...EHDT.C.ssss#',
  '#..................#',
  '#..................#',
  '#wwwww..wwwwwwwwwww#',

const GW = 20, GH = 13;
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const tileCh = (x, z) => (x < 0 || z < 0 || x >= GW || z >= GH) ? '#' : MAP[z][x];

(function buildFixtures() {
  const shelfCh = { g: 'snacks', k: 'galletas', a: 'abarrotes', R: 'bebidas' };
  for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) {

    if ('1234'.includes(c)) { f = { type: 'crate', prod: PRODS[+c - 1], h: 0.85 }; crates[f.prod] = f; }
    else if (c === 'E' || c === 'H' || c === 'D') { f = { type: 'freezer', food: { E: 'empanada', H: 'hamburguesa', D: 'postre' }[c], h: 0.8 }; freezers[f.food] = f; }
    else if (c === 'F') f = display = { type: 'display', stock: {}, fill: 0, h: 1.25, slots: {} };
    else if (c === 'T') f = mopStand = { type: 'mopstand', h: 0.5 };
    else if (c === 'C') f = dumpster = { type: 'dumpster', h: 0.9 };
    else if (shelfCh[c]) {

      const sh = shelves[prod] || (shelves[prod] = { prod, fridge: c === 'R', tiles: [], stock: 0, cap: 1, emptyT: 0, fill: 0, slots: [], alert: null });
      sh.tiles.push([x, z]); f = { type: 'shelf', shelf: sh, h: c === 'R' ? 1.75 : 0.98 };
    }
    else if (c === 'M' || c === 'V') { f = { type: 'counter', pickup: c === 'V', item: null, h: c === 'V' ? 1.3 : 0.87 }; counters.push(f); if (c === 'V') pickupFx = f; }
    else if (c === 'K') { f = { type: 'register', h: 0.87, spot: [x - 1, z], cust: null }; tills.push(f); }
    else if (c === 'O') { f = { type: 'oven', item: null, h: 1.05, glow: null, alarmT: 0 }; ovens.push(f); }

// ---- Difficulty: Intermedio is config.js as it stands; Fácil and Difícil scale a few values ----
const DIFFS = ['tutorial', 'facil', 'intermedio', 'dificil'];

// Breadth-first path over the grid: the tiles from the start's next step to the first goal.
function bfs(sx, sz, isGoal, ok, avoid) {
  const start = sz * GW + sx;
  if (sx < 0 || sz < 0 || sx >= GW || sz >= GH) return null;
  const prev = new Int16Array(GW * GH).fill(-1);
  const q = [start]; prev[start] = start;
  let head = 0, found = -1;
  while (head < q.length) {
    const i = q[head++], x = i % GW, z = (i / GW) | 0;
    if (isGoal(x, z)) { found = i; break; }
    for (const [dx, dz] of DIRS4) {
      const nx = x + dx, nz = z + dz;
      if (nx < 0 || nz < 0 || nx >= GW || nz >= GH) continue;
      const j = nz * GW + nx;
      if (prev[j] !== -1 || !ok(nx, nz)) continue;
      if (avoid && avoid(nx, nz) && !isGoal(nx, nz)) continue;
      prev[j] = i; q.push(j);
    }
  }
  if (found < 0) return null;
  const path = [];
  for (let i = found; i !== start; i = prev[i]) path.push([i % GW, (i / GW) | 0]);
  return path.reverse();
}

// ---- Three.js: materials, shapes and the outline every figure gets ---------------------------
const T3 = window.THREE;

const BOX = (w, h, d) => geo(`b${w},${h},${d}`, () => new T3.BoxGeometry(w, h, d));
const CYL = (rt, rb, h, s = 10) => geo(`c${rt},${rb},${h},${s}`, () => new T3.CylinderGeometry(rt, rb, h, s));
const SPH = (r, ws = 10, hs = 8) => geo(`s${r},${ws},${hs}`, () => new T3.SphereGeometry(r, ws, hs));
const DOME = (r, frac = 0.5) => geo(`d${r},${frac}`, () => new T3.SphereGeometry(r, 12, 6, 0, Math.PI * 2, 0, Math.PI * frac));
// The black outline: a back-faced shell a little larger than the shape (the inverted hull),
// sized per axis so thin and long shapes get the same line weight.
function outline(mesh, t = 0.022) {

  const s = g.boundingBox.getSize(new T3.Vector3()), c = g.boundingBox.getCenter(new T3.Vector3());
  const o = new T3.Mesh(g, OUT_MAT);
  o.scale.set(1 + 2 * t / Math.max(s.x, 0.02), 1 + 2 * t / Math.max(s.y, 0.02), 1 + 2 * t / Math.max(s.z, 0.02));
  o.position.set(-c.x * (o.scale.x - 1), -c.y * (o.scale.y - 1), -c.z * (o.scale.z - 1));
  mesh.add(o); return mesh;
}
function part(g, color, x = 0, y = 0, z = 0, ol = 0.022) {
  const m = new T3.Mesh(g, typeof color === 'string' ? mat(color) : color);
  m.position.set(x, y, z); if (ol) outline(m, ol); return m;
}

// ---- Characters: round, big-headed, every kind its own silhouette ---------------------------

// ---- Customers --------------------------------------------------------------------------------
function pubPath(c, gx, gz) { return bfs(Math.floor(c.x), Math.floor(c.z), (x, z) => x === gx && z === gz, pubOK) || []; }

    pmax: state.tutor ? 9999 : tune[K.patience] * dm('patience') * (state.phase === 'tut' ? tune.tutorial_patience : 1), patience: 0, arrivedOnce: false, atSlot: false, slot: null,
    checkoutP: 0, waitT: 0, slipT: 0, slipped: new Set(), spillAt: -1, forceSpill: !!opt.spill, want: null, served: false, happy: true,
    mood: '', leaveT: 0, gone: false, view: null, h: K.h, shelf: null,

}
function nextStage(c) { // shop the list, then wait for hot food or queue at the till, then leave

}

// ---- The shift: a minute that teaches, a crunch, rush hour, a breather --------------------------
const PHASE_NAME = { tut: 'Enseñanza', apuro: 'Se llena', punta: 'Hora punta', respiro: 'Respiro' };

// The first minute: one task at a time (a restock, a sale, a hot order, a spill).
const SCRIPT = [
  { t: 1.5, kind: 'escolar', list: ['snacks', 'galletas'] },
  { t: 30, kind: 'oficinista', order: 'hamburguesa' },

    const pool = { escolar: ['snacks', 'galletas', 'bebidas', 'snacks'], abuelita: ['abarrotes', 'galletas', 'abarrotes', 'bebidas'], deportista: ['bebidas', 'bebidas', 'snacks'] }[kind];

    if (msg) banner(msg);

  panel(W / 2 - 340, 190, 680, 320, COL.mag, COL.ink, 4, 16);
  text('Pausa', W / 2, 240, 44, '#FFFFFF');
  const lines = mode2P ? CONTROLS : [CONTROLS[0], CONTROLS[2]];
  lines.forEach((l, i) => text(l, W / 2, 304 + i * 36, 16, '#FFFFFF', 'center', 'normal'));
  pill('P o Esc: seguir', W / 2, 440, 20, COL.yel, COL.ink);
  pill('T: volver al inicio', W / 2, 482, 18, '#FFFFFF', COL.ink);
}
function drawOver() {
  drawPlayHUD(); wash('rgba(40, 6, 12, 0.66)');
  panel(W / 2 - 330, 180, 660, 330, '#FFFFFF', COL.ink, 4, 16);
  panel(W / 2 - 330, 180, 660, 70, COL.mag, COL.ink, 4, 16);
  text('Turno perdido', W / 2, 216, 38, '#FFFFFF');
  text('La satisfacción de la tienda llegó a cero.', W / 2, 292, 20, COL.ink, 'center', 'normal');
  text(`Venta: ${soles(state.money)} · Aguantaron ${fmtTime(state.t)} de ${fmtTime(tune.shift_length)}`, W / 2, 330, 20, COL.ink, 'center', 'normal');
  text(`Clientes molestos: ${state.angry}`, W / 2, 366, 18, COL.ink, 'center', 'normal');
  pill('R o Enter: reintentar el turno', W / 2, 424, 22, COL.yel, COL.ink);
  pill('Esc: volver al inicio (cambiar dificultad)', W / 2, 474, 20, '#FFFFFF', COL.ink);
}
function drawResults() {
  drawPlayHUD(); wash('rgba(29, 10, 24, 0.62)');
  const X = W / 2 - 380, Y = 84, PW = 760, PH = 560;
  panel(X, Y, PW, PH, '#FFFFFF', COL.ink, 4, 16);
  panel(X, Y, PW, 64, COL.mag, COL.ink, 4, 16);
  text('¡Turno terminado!', W / 2, Y + 33, 34, '#FFFFFF');
  for (let i = 0; i < 3; i++) drawStar(W / 2 - 90 + i * 90, Y + 114, 32, i < state.stars && state.resT > 0.4 + i * 0.45 ? COL.yel : '#D9D6DE');
  text(`Venta del turno: ${soles(state.money)}`, W / 2, Y + 176, 26, COL.ink);
  text(`Atendidos: ${state.served} · Se fueron molestos: ${state.angry} · Satisfacción: ${Math.ceil(state.sat)} %`, W / 2, Y + 208, 16, COL.ink, 'center', 'normal');
  text(`${DIFF_NAME[diff]}: dos estrellas desde ${soles(starGoal(2))} · tres desde ${soles(starGoal(3))}`, W / 2, Y + 232, 14, '#4A4452', 'center', 'normal');
  const rows = [['Cobros en caja', 'ventas'], ['Pedidos de comida', 'pedidos'], ['Reposiciones', 'repos'], ['Limpiezas', 'limpiezas'], ['Bolsas de basura', 'bolsas'], ['Levantó al compañero', 'ayudas'], ['Resbalones', 'resbalones'], ['Choques', 'choques'], ['Aporte en soles', 'soles']];
  const c1 = W / 2 + 120, c2 = W / 2 + 270, top = Y + 270;
  state.workers.forEach((w, i) => pill(w.name, i ? c2 : c1, top, 16, w.id === 'p1' ? COL.mag : w.id === 'p2' ? '#FFFFFF' : '#3B3742', w.id === 'p2' ? COL.ink : '#FFFFFF'));
  rows.forEach(([label, k], r) => {
    const y = top + 34 + r * 24;
    if (r % 2 === 0) { ctx.fillStyle = '#F4EEF3'; ctx.fillRect(X + 40, y - 12, PW - 80, 24); }
    text(label, X + 60, y, 16, COL.ink, 'left', 'normal');
    state.workers.forEach((w, i) => text(k === 'soles' ? soles(w.stats.soles) : String(w.stats[k]), i ? c2 : c1, y, 16, COL.ink));
  });
  pill('Enter: otro turno · Esc: título', W / 2, Y + PH - 28, 20, COL.yel, COL.ink);
}
function buildFigures() { // every unit and thing side by side, for the outline check
  figScene = new T3.Scene(); addLights(figScene); figScene.background = new T3.Color('#F4F0F5');
  const floor = new T3.Mesh(new T3.PlaneGeometry(30, 14), mat('#E9E4EE')); floor.rotation.x = -Math.PI / 2; figScene.add(floor);
  const people = [['J1', makeWorker('j1')], ['J2', makeWorker('j2')], ['BOT', makeWorker('bot')], ['Escolar', makeCustomer('escolar', 0)], ['Abuelita', makeCustomer('abuelita', 1)], ['Oficinista', makeCustomer('oficinista', 2)], ['Obrero', makeCustomer('obrero', 3)], ['Deportista', makeCustomer('deportista', 1)]];
  people.forEach(([name, c], i) => { const x = (i - 3.5) * 1.3; c.g.position.set(x, 0, 0); c.g.rotation.y = 0.35; figScene.add(c.g); figLabels.push({ name, x, y: 0, z: 0.6 }); });
  const things = [['Caja de snacks', boxMesh('snacks')], ['Caja de bebidas', boxMesh('bebidas')], ['Empanada', foodMesh('empanada')], ['Hamburguesa', foodMesh('hamburguesa')], ['Postre', foodMesh('postre')], ['Caja congelada', foodBoxMesh('postre')], ['Trapeador', mopMesh()], ['Bolsa', bagMesh()], ['Derrame', spillMesh('liquid')]];
  things.forEach(([name, m], i) => { const x = (i - 4) * 1.08; m.position.set(x, 0, 2.3); m.scale.setScalar(name === 'Trapeador' ? 0.8 : name === 'Derrame' ? 1.1 : 1.4); m.rotation.y = 0.5; figScene.add(m); figLabels.push({ name, x, y: 0, z: 2.95 }); });
  figCam = new T3.PerspectiveCamera(34, W / H, 0.1, 100); figCam.position.set(0, 4.6, 9.4); figCam.lookAt(0, 0.6, 1.0); figCam.updateMatrixWorld(true);
}
function drawFigures() {
  ctx.clearRect(0, 0, W, H);
  if (!renderer) { ctx.fillStyle = COL.plum; ctx.fillRect(0, 0, W, H); text('Este juego necesita WebGL en el navegador.', W / 2, H / 2, 24, '#FFFFFF'); return; }
  if (!figScene) buildFigures();
  renderer.render(figScene, figCam);
  text(`Figuras de ${TITLE}`, W / 2, 36, 28, COL.ink);
  for (const l of figLabels) {
    V3.set(l.x, l.y, l.z).project(figCam);
    pill(l.name, (V3.x + 1) / 2 * W, (1 - V3.y) / 2 * H, 15, '#FFFFFF', COL.ink);
  }
}

// ---- The tutorial: one task at a time. A short card pauses the shop; Enter, then you do it ------
// Each step: a title and one or two short lines; setup() makes the situation; done() says when
// the task is finished (no done(): a card to read only); where() points the yellow arrow.
const at = (f, label, y = 1.2) => ({ x: f.x + 0.5, y, z: f.z + 0.5, label });
const holding = pred => state.workers.some(w => w.held && pred(w.held));
const TUT_STEPS = [
  { title: 'Tu turno en la tienda', lines: ['Muévete con WASD (J2: flechas).', 'Camina un poco por la tienda.'],
    setup() { const w = state.workers[0]; state.tutor.x0 = w.x; state.tutor.z0 = w.z; },
    done: () => Math.hypot(state.workers[0].x - state.tutor.x0, state.workers[0].z - state.tutor.z0) > 2.5 },
  { title: 'Reponer las góndolas', lines: ['Los clientes vacían las góndolas. Trae una caja de snacks', 'del almacén con E y mantén F frente a la góndola.'],
    setup() { shelves.snacks.stock = 0; },
    done: () => shelves.snacks.stock >= shelves.snacks.cap,
    where: () => holding(i => i.kind === 'box' && i.prod === 'snacks') ? { x: shelves.snacks.cx, y: 1.5, z: shelves.snacks.cz, label: 'Mantén F aquí' } : at(crates.snacks, 'Caja de snacks', 1.1) },
  { title: 'Cobrar en caja', lines: ['Los clientes hacen una sola cola para las dos cajas.', 'Párate detrás de la caja con cliente y mantén F.'],
    setup() { state.tutor.base = state.served; spawnCustomer('escolar', ['galletas'], null); },
    done: () => state.served > state.tutor.base,
    where: () => { const t = tills.find(t => t.cust && t.cust.atSlot); return t ? at(t, 'Mantén F para cobrar', 1.3) : null; } },
  { title: 'Pedido de comida caliente', lines: ['Saca la hamburguesa de la vitrina fría (E), caliéntala en el', 'horno y llévala a ENTREGA. Si se pasa, se quema.'],
    setup() { state.tutor.base = state.served; spawnCustomer('oficinista', [], 'hamburguesa'); },
    done: () => state.served > state.tutor.base,
    where: () => state.pickup.some(c => !c.served) ? hotHint('hamburguesa') : null },
  { title: 'Postres', lines: ['El postre va frío: de la vitrina fría', 'directo a ENTREGA, sin horno.'],
    setup() { state.tutor.base = state.served; spawnCustomer('abuelita', [], 'postre'); },
    done: () => state.served > state.tutor.base,
    where: () => state.pickup.some(c => !c.served) ? hotHint('postre') : null },
  { title: 'Reponer la vitrina fría', lines: ['Se acabaron las empanadas. Trae una caja del congelador', 'del almacén y mantén F frente a la vitrina fría.'],
    setup() { display.stock.empanada = 0; },
    done: () => display.stock.empanada >= tune.display_cap,
    where: () => holding(i => i.kind === 'foodbox' && i.food === 'empanada') ? at(display, 'Mantén F aquí', 1.6) : at(freezers.empanada, 'Caja de empanadas', 1.1) },
  { title: 'Pasar cosas por el mostrador', lines: ['Deja algo sobre el mostrador con E y quien está', 'del otro lado lo toma con E. Ahorra la vuelta.'] },
  { title: 'Derrames', lines: ['Quien pisa un charco se resbala y suelta lo que lleva.', 'Trae el trapeador y mantén F junto al charco.'],
    setup() { makeSpill(8.5, 8.5, 'liquid'); },
    done: () => state.spills.length === 0,
    where: () => { const s = state.spills[0]; if (!s) return null; return state.mop.place === 'held' ? { x: s.x, y: 0.6, z: s.z, label: 'Mantén F aquí' } : { ...(([x, z]) => ({ x, z }))(itemXZ(state.mop)), y: 1.0, label: 'Trapeador' }; } },
  { title: 'El tacho de basura', lines: ['El tacho se llenó. Saca la bolsa con E y', 'llévala al contenedor verde del almacén.'],
    setup() { bin.fill = tune.bin_cap; },
    done: () => bin.fill === 0 && !state.items.some(i => i.kind === 'bag'),
    where: () => holding(i => i.kind === 'bag') ? at(dumpster, 'Contenedor', 1.2) : at(bin, 'Saca la bolsa', 1.1) },
  { title: 'Resbalones y choques', lines: ['Si tu compañero se resbala, mantén F a su lado para levantarlo.', 'Chocar de frente corriendo tira lo que cargan los dos.'] },
  { title: 'Avisar', lines: ['Pulsa Q (J2: J) para marcar un punto con sonido.', 'El BOT va a ayudar ahí. Pruébalo.'],
    setup() { state.tutor.signaled = false; },
    done: () => state.tutor.signaled },
  { title: 'Satisfacción y estrellas', lines: ['Clientes molestos, góndolas vacías y derrames bajan la satisfacción:', 'en cero se pierde el turno. Más soles, más estrellas.'] },
  { title: '¡Listo para tu turno!', lines: ['Ya sabes hacer todo. Enter vuelve al inicio:', 'elige Fácil, Intermedio o Difícil.'], last: true },
];
function tutorUpdate() { // true while a card is up
  const T = state.tutor, s = TUT_STEPS[T.i];
  if (T.card) {
    if (pressed('Enter') || pressed('Space')) {
      if (s.last) { diff = 'facil'; reset(); scene = 'title'; return true; }
      T.card = false; sfx.grab();
      if (s.setup) s.setup();
      if (!s.done) { T.i++; T.card = true; }
    }
    return true;
  }
  if (s.done()) { sfx.task(); banner('¡Bien hecho!'); T.i++; T.card = true; }
  return false;
}
function drawTutor() {
  const T = state.tutor; if (!T) return;
  const s = TUT_STEPS[Math.min(T.i, TUT_STEPS.length - 1)];
  if (!T.card) { pill(`Paso ${T.i + 1}: ${s.title}`, W / 2, H - 28, 16, '#FFFFFF', COL.ink); return; }
  ctx.fillStyle = 'rgba(29, 10, 24, 0.35)'; ctx.fillRect(0, 0, W, H);
  const X = W / 2 - 380, Y = H - 250, PW = 760, PH = 200;
  panel(X, Y, PW, PH, COL.mag, COL.ink, 4, 16);
  text(`Paso ${T.i + 1} de ${TUT_STEPS.length}`, X + 24, Y + 28, 14, '#FFFFFF', 'left', 'normal');
  text(s.title, W / 2, Y + 54, 28, '#FFFFFF');
  s.lines.forEach((l, i) => text(l, W / 2, Y + 96 + i * 30, 18, '#FFFFFF', 'center', 'normal'));
  pill(s.last ? 'Enter: volver al inicio' : s.done ? 'Enter: a hacerlo' : 'Enter: entendido', W / 2, Y + PH - 26, 18, COL.yel, COL.ink);
}

// ---- Scenes: title, play, pause, lost shift, results, figures --------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; animT += dt; },
    draw() { drawFigures(); },
  },
  title: {
    update(dt) {
      animT += dt;
      if (pressed('KeyK')) { mode2P = !mode2P; reset(); sfx.signal(); }
      const pickDiff = i => { diff = DIFFS[(i + DIFFS.length) % DIFFS.length]; sfx.grab(); };
      ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4'].forEach((k, i) => { if (pressed(k)) pickDiff(i % 4); });
      if (pressed('KeyA') || pressed('ArrowLeft')) pickDiff(DIFFS.indexOf(diff) - 1);
      if (pressed('KeyD') || pressed('ArrowRight')) pickDiff(DIFFS.indexOf(diff) + 1);
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; sfx.banner(); }
    },
    draw() { render3D(); drawTitle(); },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      if (state.tutor && tutorUpdate()) return; // a tutorial card is up: the shop waits
      state.t += dt; animT += dt;
      if (!state.tutor) director(dt);
      for (const w of state.workers) updateWorker(w, dt);
      workerCollisions();
      for (const c of state.customers) updateCustomer(c, dt);
      cleanCustomers();
      updateItems(dt);
      updateMess(dt);
      updateFX(dt);
      state.score = Math.round(state.money);
      if (state.sat <= 0) { state.sat = 0; state.gained = 'Turno perdido'; scene = 'over'; sfx.lose(); events.push({ type: 'lose', t: state.t }); }
      else if (state.t >= tune.shift_length && !state.tutor) finishShift();
    },
    draw() { render3D(); drawPlayHUD(); },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      else if (pressed('KeyT')) { reset(); scene = 'title'; }
    },
    draw() { render3D(); drawPause(); },
  },
  over: {
    update() {
      if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; }
      else if (pressed('Escape') || pressed('KeyT')) { reset(); scene = 'title'; }
    },
    draw() { render3D(); drawOver(); },
  },
  results: {
    update(dt) {
      const before = state.resT; state.resT += dt;
      for (let i = 0; i < state.stars; i++) { const at = 0.4 + i * 0.45; if (before < at && state.resT >= at) sfx.star(i); }
      if (pressed('Enter')) { reset(); scene = 'play'; }
      else if (pressed('Escape')) { reset(); scene = 'title'; }
    },
    draw() { render3D(); drawResults(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

initThree();
reset();
scene = params.get('scene') || 'title';
last = clock.now(); lastDraw = last;
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
